<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitsmachine</title>
<style>
  * { box-sizing: border-box; }
  :root { --bg:#eef6ff; --text:#223; --panel:#fff; --accent:#4a90e2; --top:#ffe27a; --left:#9be39b; --right:#ff9b9b; --line:#333; }
  body[data-theme="sint"] { --bg:#fff4d6; --text:#5a1414; --accent:#c8102e; --top:#ffd54a; --left:#ffffff; --right:#f4b6bd; --line:#8a1c1c; }
  body[data-theme="kerstman"] { --bg:#e6f4ea; --text:#12351f; --accent:#c62828; --top:#ffffff; --left:#a5d6a7; --right:#ef9a9a; --line:#1b5e20; }
  body { font-family: "Comic Sans MS", "Segoe UI", sans-serif; background:var(--bg); margin:0; padding:20px; text-align:center; color:var(--text); transition:background .3s; }
  h1 { margin:0 0 10px; }
  .panel { background:var(--panel); border-radius:16px; padding:16px; max-width:720px; margin:0 auto 16px; box-shadow:0 2px 8px #0002; }
  label { display:inline-block; margin:8px 14px; font-size:18px; }
  input[type=number] { width:70px; font-size:20px; padding:4px; text-align:center; }
  select, button { font-size:18px; padding:6px 12px; border-radius:8px;   border:2px solid var(--accent); background:#fff; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; }
    .deco { font-size:34px; letter-spacing:8px; margin-bottom:4px; }
  .machine { display:flex; flex-direction:column; align-items:center; gap:0; margin-top:10px; }
  .circle { width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:bold;   border:5px solid var(--line); background:#fff; color:#222; }
    .circle.top { background:var(--top); }
    .circle.left { background:var(--left); }
    .circle.right { background:var(--right); }
  .circle input { width:80px; height:80px; font-size:40px; border:none; text-align:center; background:transparent; font-weight:bold; }
  .circle input:focus { outline:3px solid #4a90e2; border-radius:50%; }
  .circle.ok { background:#7be27b; }
  .circle.bad { background:#ff6b6b; }
  .legs { display:flex; gap:60px; margin-top:-8px; }
  svg { display:block; }
  #msg { font-size:22px; min-height:32px; margin-top:12px; font-weight:bold; }
  #score { font-size:18px; margin-top:6px; }
  .circle { isolation:isolate; position:relative; }
  /* Kerstman: kerstballen */
  body[data-theme="kerstman"] .circle { box-shadow:inset -10px -12px 20px #0003, 0 6px 0 #0003; border-width:4px; }
  body[data-theme="kerstman"] .circle::before { content:""; position:absolute; top:-16px; left:50%; width:30px; height:18px; margin-left:-15px; background:linear-gradient(#ffd54a,#c9a227); border:3px solid #8d6e0f; border-radius:6px 6px 2px 2px; z-index:-1; }
  body[data-theme="kerstman"] .circle::after { content:""; position:absolute; top:12px; left:18px; width:26px; height:14px; background:#fff9; border-radius:50%; transform:rotate(-35deg); pointer-events:none; }
  body[data-theme="kerstman"] .circle.top { background:radial-gradient(circle at 35% 30%,#fff,#ffd54a 70%); }
  body[data-theme="kerstman"] .circle.left { background:radial-gradient(circle at 35% 30%,#e8ffe8,#43a047 80%); }
  body[data-theme="kerstman"] .circle.right { background:radial-gradient(circle at 35% 30%,#ffe8e8,#e53935 80%); }
  /* Sint: pakjes */
  body[data-theme="sint"] .circle { border-radius:18px; border-width:4px; }
  body[data-theme="sint"] .circle::before { content:"🎀"; position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:36px; z-index:2; }
  body[data-theme="sint"] .circle.top { background-image:linear-gradient(90deg,transparent 40%,#c8102e66 40% 60%,transparent 60%),linear-gradient(transparent 40%,#c8102e66 40% 60%,transparent 60%); }
  body[data-theme="sint"] .circle.left { background-image:linear-gradient(90deg,transparent 40%,#1e88e599 40% 60%,transparent 60%),linear-gradient(transparent 40%,#1e88e599 40% 60%,transparent 60%); background-color:#fff59d; }
  body[data-theme="sint"] .circle.right { background-image:linear-gradient(90deg,transparent 40%,#8e24aa88 40% 60%,transparent 60%),linear-gradient(transparent 40%,#8e24aa88 40% 60%,transparent 60%); background-color:#ffcc80; }
  .scene { position:fixed; inset:0; z-index:0; pointer-events:none; display:none; overflow:hidden; }
  .scene svg { position:absolute; bottom:0; left:0; width:100%; height:auto; }
  .cloud { position:absolute; font-size:90px; opacity:.35; filter:brightness(.55) saturate(.6); animation:drift 90s linear infinite; }
  @keyframes drift { from { transform:translateX(-20vw); } to { transform:translateX(120vw); } }
  #sceneSint .star { filter:drop-shadow(0 0 6px #fff7b0); }
  body[data-theme="sint"] #sceneSint, body[data-theme="kerstman"] #sceneKerst { display:block; }
  .rider { position:absolute; font-size:64px; white-space:nowrap; animation:ride 28s linear infinite; }
  @keyframes ride { from { left:-15%; } to { left:110%; } }
  #sceneSint .rider { bottom:calc(45vh - 20px); }
  #sceneKerst .rider { top:8vh; animation-duration:22s; }
  .star { position:absolute; font-size:26px; animation:twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity:.3; transform:scale(.7); } }
  .legs { margin-top:12px; }
  #new { margin:8px 14px; }
  body[data-theme] .circle.ok { background-color:#7be27b; }
  body[data-theme] .circle.bad { background-color:#ff6b6b; }
  body[data-theme="kerstman"] .circle.ok { background:#7be27b; }
  body[data-theme="kerstman"] .circle.bad { background:#ff6b6b; }
  .hidden { display:none; }
  body { background:var(--grad, var(--bg)) fixed; min-height:100vh; overflow-x:hidden; }
  body[data-theme="standaard"] { --grad:linear-gradient(135deg,#ffd6e8,#d6ecff 40%,#fff6bf 70%,#d9ffd6); }
  body[data-theme="sint"] { --grad:radial-gradient(circle at 12% 12%,#fff6c933 0,transparent 14%),linear-gradient(180deg,#070b26,#141a4a 55%,#2d2360); }
  body[data-theme="kerstman"] { --grad:radial-gradient(circle,#ffffff55 2px,transparent 3px) 0 0/60px 60px,linear-gradient(180deg,#07123a,#0d2a6b 60%,#1a4a8c); }
  body[data-theme="sint"] h1, body[data-theme="kerstman"] h1 { color:#fff; text-shadow:3px 3px 0 #7f0000; }
  body[data-theme="sint"] h1 { text-shadow:3px 3px 0 #0b1030; }
  body[data-theme="kerstman"] h1 { text-shadow:3px 3px 0 #07123a; }
  body[data-theme="sint"] .deco, body[data-theme="kerstman"] .deco { filter:drop-shadow(0 2px 2px #0006); }
  body[data-theme="sint"] .panel { background:#fffaf0; border-color:#ffd54a; }
  body[data-theme="kerstman"] .panel { background:#fffafa; border-color:#2e7d32; }
  h1 { font-size:2.4rem; color:var(--accent); text-shadow:3px 3px 0 #fff, 5px 5px 0 #0002; }
  .panel { border:4px solid var(--accent); border-radius:24px; position:relative; z-index:1; }
  button, select { transition:transform .15s; font-weight:bold; }
  button:hover { transform:scale(1.08) rotate(-2deg); }
  button#check { font-size:22px; padding:10px 28px; background:#ffb300; border-color:#e65100; color:#fff; margin-top:10px; }
  .circle { box-shadow:0 6px 0 #0003; animation:pop .5s ease both; }
  .circle.left { animation-delay:.1s; } .circle.right { animation-delay:.2s; }
  .circle.ok { animation:jump .6s ease; }
  .circle.bad { animation:shake .4s ease; }
  @keyframes pop { from { transform:scale(0) rotate(-90deg); } to { transform:scale(1); } }
  @keyframes jump { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-30px) scale(1.2); } }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-10px); } 75% { transform:translateX(10px); } }
  .deco { animation:wiggle 2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(3deg); } }
  #msg { color:var(--accent); font-size:26px; }
  .fall { position:fixed; top:-50px; z-index:0; pointer-events:none; animation:fall linear forwards; }
  .confetti { position:fixed; z-index:5; pointer-events:none; font-size:32px; animation:burst 1.2s ease-out forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }
  @keyframes burst { to { transform:translate(var(--dx),var(--dy)) rotate(540deg); opacity:0; } }
  table { margin:0 auto; border-collapse:collapse; }
  td { border:1px solid #ccc; padding:4px 14px; font-size:20px; }
</style>
</head>

      <rect x="74" y="-2" width="26" height="22" fill="#1e88e5"/><rect x="85" y="-2" width="4" height="22" fill="#ffd54a"/>
    </g>
    <g fill="#fff" opacity=".9"><circle cx="100" cy="120" r="3"/><circle cx="260" cy="90" r="2"/><circle cx="410" cy="60" r="3"/><circle cx="640" cy="110" r="2"/><circle cx="820" cy="40" r="3"/><circle cx="1100" cy="70" r="2"/><circle cx="1150" cy="150" r="3"/></g>
  </svg>
</div>

<div class="deco" id="deco"></div>
<h1 id="title">🧮 Splitsmachine</h1>

<div class="panel">
  <label>Thema:
    <select id="theme">
      <option value="standaard">Standaard</option>
      <option value="sint">De Sint 🎅🏻</option>
      <option value="kerstman">De Kerstman 🎄</option>
    </select>
  </label>
  <label>Getal van <input type="number" id="min" value="2" min="2" max="100"> tot <input type="number" id="max" value="10" min="2" max="100"></label>
  <label>Modus:
    <select id="mode">
      <option value="oefen">Oefenen (vul het ontbrekende getal in)</option>
      <option value="toon">Alle splitsingen tonen</option>
    </select>
  </label>
  <button class="primary" id="new">Nieuwe oefening</button>
</div>

<div class="panel" id="practice">
  <div class="machine">
    <div class="circle top" id="top"></div>
    <svg width="220" height="50"><line x1="110" y1="0" x2="55" y2="50" stroke="#333" stroke-width="4"/><line x1="110" y1="0" x2="165" y2="50" stroke="#333" stroke-width="4"/></svg>
    <div class="legs">
      <div class="circle left" id="left"></div>
      <div class="circle right" id="right"></div>
    </div>
  </div>
  <div id="msg"></div>
  <button id="check">Controleer</button>
  <div id="score"></div>
</div>

<div class="panel hidden" id="showAll">
  <h2 id="showTitle"></h2>
  <table id="table"></table>
</div>

<script>
const $ = id => document.getElementById(id);
let total, hiddenSide, answer, correct = 0, tried = 0;

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function newExercise() {
  let lo = Math.max(2, +$('min').value || 2), hi = Math.max(lo, +$('max').value || 10);
  if (hi > 100) hi = 100;
  total = rnd(lo, hi);
  const a = rnd(0, total);
  const b = total - a;
  hiddenSide = Math.random() < 0.5 ? 'left' : 'right';
  const shown = hiddenSide === 'left' ? b : a;
  answer = hiddenSide === 'left' ? a : b;
  $('top').textContent = total;
  for (const side of ['left', 'right']) {
    const el = $(side);
    el.className = 'circle ' + side;
    if (side === hiddenSide) {
      el.innerHTML = '<input type="number" min="0" max="' + total + '">';
      el.firstChild.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    } else {
      el.textContent = shown;
    }
  }
  $('msg').textContent = '';
  $(hiddenSide).firstChild.focus();
}

function check() {
  const input = $(hiddenSide).querySelector('input');
  if (!input || input.value === '') return;
  tried++;
  const el = $(hiddenSide);
  if (+input.value === answer) {
    correct++;
    el.classList.add('ok');
    confetti();
    $('msg').textContent = THEMES[document.body.dataset.theme].praise;
    setTimeout(newExercise, 1200);
  } else {
    el.classList.add('bad');
    $('msg').textContent = 'Probeer nog eens!';
    input.select();
    setTimeout(() => el.classList.remove('bad'), 800);
  }
  $('score').textContent = 'Score: ' + correct + ' / ' + tried;
}

function showAll() {
  const n = +$('max').value || 10;
  $('showTitle').textContent = 'Splitsingen van ' + n;
  let html = '';
  for (let i = 0; i <= n; i++) html += '<tr><td>' + n + '</td><td>=</td><td>' + i + '</td><td>+</td><td>' + (n - i) + '</td></tr>';
  $('table').innerHTML = html;
}

function update() {
  const toon = $('mode').value === 'toon';
  $('practice').classList.toggle('hidden', toon);
  $('showAll').classList.toggle('hidden', !toon);
  if (toon) showAll(); else newExercise();
}

const THEMES = {
  standaard: { title: '🧮 Splitsmachine', deco: '🌈 ⭐ 🎈 ⭐ 🌈', fall: ['⭐','🎈','🌈','🦄','🧁'], praise: '🎉 Goed zo!' },
  sint: { title: '🎁 Splitsmachine van de Sint', deco: '🐴 🎁 🍬 🎁 🐴', fall: ['🍬','🎁','🍪','⭐','🐴'], praise: '🍬 Pepernoten voor jou, goed zo!' },
  kerstman: { title: '🎄 Splitsmachine van de Kerstman', deco: '❄️ 🎅 🎄 🎅 ❄️', fall: ['❄️','🎄','🎁','⭐','🦌'], praise: '🎅 Ho ho ho, goed gedaan!' }
};
let fallTimer;
function startFalling() {
  clearInterval(fallTimer);
  document.querySelectorAll('.fall').forEach(e => e.remove());
  fallTimer = setInterval(() => {
    const list = THEMES[document.body.dataset.theme].fall;
    const s = document.createElement('span');
    s.className = 'fall';
    s.textContent = list[rnd(0, list.length - 1)];
    s.style.left = rnd(0, 95) + 'vw';
    s.style.fontSize = rnd(20, 40) + 'px';
    s.style.animationDuration = rnd(6, 12) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12500);
  }, 600);
}
function confetti() {
  const list = THEMES[document.body.dataset.theme].fall;
  const r = $('top').getBoundingClientRect();
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = list[i % list.length];
    s.style.left = r.left + r.width / 2 + 'px';
    s.style.top = r.top + r.height / 2 + 'px';
    s.style.setProperty('--dx', rnd(-250, 250) + 'px');
    s.style.setProperty('--dy', rnd(-250, 150) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}
function applyTheme(name) {
  if (!THEMES[name]) name = 'standaard';
  document.body.dataset.theme = name;
  startFalling();
  $('title').textContent = THEMES[name].title;
  $('deco').textContent = THEMES[name].deco;
  $('theme').value = name;
  try { localStorage.setItem('theme', name); } catch (e) {}
}
$('theme').onchange = () => applyTheme($('theme').value);
let saved = 'standaard';
try { saved = localStorage.getItem('theme') || 'standaard'; } catch (e) {}
applyTheme(saved);

$('check').onclick = check;
$('new').onclick = update;
$('mode').onchange = update;
update();
</script>
</body>
</html>
